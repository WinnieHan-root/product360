# 商品中心 —— Nginx 站点配置
# 职责：① 托管 Vite 静态产物（SPA 路由 fallback）；② /api 反代到 api 容器。
# 后期加域名 + HTTPS 时，只需另加 server 块并把 80 改成 301 跳转，见 docs/deploy-aliyun.md §7。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传上限（当前接口无文件上传，留作余量）
    client_max_body_size 8m;

    # 不要把后端错误细节透给浏览器
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 安全响应头（同源部署，不启用 CSP 以免误伤 ECharts 内联样式）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # API 反代：容器网络内用服务名 api
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # SPA 路由 fallback（/products、/products/:spu/overview 等直达刷新都要能开）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
